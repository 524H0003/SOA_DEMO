<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f1e8;color:#20332f;font-family:Arial,sans-serif;">
    <main style="max-width:640px;margin:32px auto;padding:32px;background:#fffdf8;border:1px solid #d8ded2;border-radius:12px;">
      <p style="color:#6d8279;font-size:12px;letter-spacing:.08em;text-transform:uppercase;">Absent Desk</p>
      <h1 style="font-size:26px;margin:8px 0 24px;">Absent request AR-$request_id</h1>
      <p><strong>Employee:</strong> $employee_name ($employee_email)</p>
      <p><strong>Type:</strong> $absent_type</p>
      <p><strong>Dates:</strong> $start_date to $end_date</p>
      <p><strong>Reason:</strong> $reason</p>
      <p>Please reply with exactly <strong>$approve_command</strong> or <strong>$reject_command</strong>.</p>
      <p><a href="$mailto" style="color:#1e5148;font-weight:700;">Open a prefilled reply email</a></p>
    </main>
  </body>
</html>
